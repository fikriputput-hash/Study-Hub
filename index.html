.tip{background:rgba(14,165,233,.15);border-left:4px solid var(--tip);padding:.8rem 1rem;border-radius:0 8px 8px 0;margin:1rem 0}
ul,ol{padding-left:1.3rem}
#note{padding-bottom:2rem}
#empty{text-align:center;color:var(--muted);padding:2rem}
table{width:100%;border-collapse:collapse;margin:.8rem 0;font-size:.95rem}
td,th{border:1px solid #334155;padding:.4rem .6rem;text-align:left}
th{background:#1e293b}

function safe(t){return String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function setGrade(g){
 grade=g;
 $("g4").classList.toggle("active",g===4);
 $("g5").classList.toggle("active",g===5);
 render();
}

function render(){
 const q=($("search").value||"").toLowerCase().trim();
 const list=DATA[grade].filter(s=>!q||s[0].toLowerCase().includes(q)||s[2].some(c=>c.toLowerCase().includes(q)));
 $("subjects").innerHTML="";
 list.forEach(s=>{
  const b=document.createElement("button");
  b.className="subject";
  b.innerHTML=`<span>${s[1]}</span><strong>${safe(s[0])}</strong><small>Tingkatan ${grade} · ${s[2].length} topik</small>`;
  b.onclick=()=>openSubject(s);
  $("subjects").appendChild(b);
 });
 $("count").textContent=list.length+" subjek";
 $("empty").classList.toggle("hidden",list.length>0);
}

function show(id){["home","subjectPage","notePage"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo(0,0);}

function openSubject(s){
 selected=s;
 $("subjectTitle").textContent=s[0]+" — Tingkatan "+grade;
 $("chapters").innerHTML="";
 s[2].forEach((chapter,i)=>{
  const b=document.createElement("button");
  b.className="chapter";
  b.textContent="Bab "+(i+1)+": "+chapter+"  ›";
  b.onclick=()=>openNote(chapter,i);
  $("chapters").appendChild(b);
 });
 show("subjectPage");
}

 let body="";

<h2>1.1 Bidang Biologi dan Kerjaya</h2>
<p>Biologi ialah bidang sains yang mengkaji organisma hidup, struktur, fungsi, pertumbuhan, asal usul, evolusi dan interaksi dengan persekitaran.</p>
<ul>
<li><b>Botani</b> – kajian tumbuhan</li>
<li><b>Zoologi</b> – kajian haiwan</li>
<li><b>Mikrobiologi</b> – kajian mikroorganisma</li>
<li><b>Ekologi</b> – hubungan organisma dengan persekitaran</li>
<li><b>Genetik</b> – pewarisan ciri</li>
<li><b>Fisiologi</b> – fungsi sistem dalam organisma</li>
</ul>
<p>Kerjaya berkaitan: doktor, ahli farmasi, ahli bioteknologi, ahli ekologi, guru biologi, saintis forensik.</p>

<h2>1.2 Keselamatan dan Peraturan Makmal</h2>
<ul>
<li>Patuhi arahan guru dan baca label bahan kimia dengan teliti.</li>
<li>Jangan makan, minum atau menyimpan makanan di makmal.</li>
<li>Pakai peralatan pelindung diri (PPE): cot lab, gogal, sarung tangan bila perlu.</li>
<li>Kendalikan radas dengan cermat; jangan guna radas yang retak.</li>
<li>Laporkan sebarang kemalangan, tumpahan atau kerosakan segera kepada guru.</li>
<li>Buang bahan buangan mengikut arahan (bahan kimia berbahaya tidak dibuang ke sinki).</li>
<li>Basuh tangan selepas eksperimen.</li>
</ul>

<h2>1.3 Berkomunikasi dalam Biologi</h2>
<p>Lukis rajah biologi dengan jelas, label dengan anak panah lurus, gunakan istilah saintifik yang tepat, dan catat pemerhatian secara objektif.</p>

<h2>1.4 Penyiasatan Saintifik</h2>
<p>Langkah: kenal pasti masalah → buat hipotesis → rancang eksperimen (pemboleh ubah dimanipulasi, bergerak balas, dimalarkan) → kumpul data → analisis → buat kesimpulan.</p>
<div class="tip"><b>Ingat:</b> Bezakan <b>pemerhatian</b> (apa yang dilihat/diukur) dengan <b>inferens</b> (tafsiran berdasarkan pemerhatian).</div>
<h2>Uji Kefahaman</h2>
<ol>
<li>Nyatakan tiga bidang dalam Biologi.</li>
<li>Berikan empat peraturan keselamatan makmal.</li>
<li>Apakah perbezaan antara pemerhatian dan inferens?</li>
</ol>`;
  }
  else if(index===1){ // Bab 2
   body=`
<h2>2.1 Struktur dan Fungsi Sel</h2>
<p>Sel ialah unit asas kehidupan. Semua organisma terdiri daripada sel.</p>
<table>
<tr><th>Organel</th><th>Fungsi</th></tr>
<tr><td>Nukleus</td><td>Kawal aktiviti sel, mengandungi DNA</td></tr>
<tr><td>Mitokondria</td><td>Tapak respirasi sel, hasilkan ATP</td></tr>
<tr><td>Kloroplas</td><td>Tapak fotosintesis (sel tumbuhan)</td></tr>
<tr><td>Ribosom</td><td>Sintesis protein</td></tr>
<tr><td>Jalinan endoplasma</td><td>Pengangkutan bahan dalam sel</td></tr>
<tr><td>Alat Golgi</td><td>Ubah suai, bungkus & hantar protein/lipid</td></tr>
<tr><td>Lisosom</td><td>Cerna bahan (sel haiwan)</td></tr>
<tr><td>Vakuol</td><td>Simpan air, nutrien, bahan buangan</td></tr>
<tr><td>Dinding sel</td><td>Sokongan & bentuk (sel tumbuhan – selulosa)</td></tr>
<tr><td>Membran plasma</td><td>Kawal pergerakan bahan masuk/keluar sel</td></tr>
</table>
<p><b>Perbezaan sel haiwan vs sel tumbuhan:</b></p>
<ul>
<li>Sel tumbuhan: ada dinding sel, kloroplas, vakuol besar</li>
<li>Sel haiwan: tiada dinding sel & kloroplas, vakuol kecil/tiada, ada sentriol</li>
</ul>

<h2>2.2 & 2.3 Proses Hidup Organisma Unisel & Multisel</h2>
<p>Organisma unisel (cth: Amoeba, Paramecium) menjalankan semua proses hidup dalam satu sel. Organisma multisel mempunyai sel khusus yang membentuk tisu, organ dan sistem.</p>

<h2>2.4 Aras Organisasi</h2>
<p>Sel → Tisu → Organ → Sistem organ → Organisma</p>

<h2>Uji Kefahaman</h2>
<ol>
<li>Nyatakan fungsi mitokondria dan kloroplas.</li>
<li>Berikan tiga perbezaan antara sel haiwan dan sel tumbuhan.</li>
<li>Susun aras organisasi daripada paling mudah ke paling kompleks.</li>
</ol>`;

   body=`
<h2>3.1 Struktur Membran Plasma</h2>
<p>Model <b>cecair-mosaik</b> (Singer & Nicolson): dwilapis fosfolipid dengan protein tertanam. Kepala fosfolipid bersifat hidrofilik, ekor hidrofobik.</p>

<h2>3.2 Konsep Pergerakan Bahan</h2>
<ul>
<li><b>Resapan mudah</b> – dari kepekatan tinggi ke rendah, tiada tenaga, melalui dwilapis lipid (O₂, CO₂)</li>
<li><b>Resapan berbantu</b> – melalui protein saluran/pembawa, tiada tenaga (glukosa, asid amino)</li>
<li><b>Osmosis</b> – pergerakan air merentasi membran separa telap dari keupayaan air tinggi ke rendah</li>
<li><b>Pengangkutan aktif</b> – melawan kecerunan kepekatan, memerlukan tenaga ATP & protein pembawa (ion Na⁺/K⁺)</li>
</ul>

<h2>3.3 Dalam Organisma Hidup</h2>
<p>Contoh: penyerapan glukosa di vilus usus (pengangkutan aktif), pertukaran gas di alveolus (resapan), kemasukan air ke sel akar (osmosis).</p>

<div class="tip"><b>Istilah penting:</b> Hipotonik (keupayaan air tinggi), Hipertonik (keupayaan air rendah), Isotonik (keupayaan air sama). Sel haiwan dalam larutan hipotonik boleh lisis; sel tumbuhan menjadi turgid.</div>
<h2>Uji Kefahaman</h2>
<ol>
<li>Bezakan resapan mudah dengan pengangkutan aktif.</li>
<li>Apakah yang berlaku kepada sel haiwan dalam larutan hipotonik?</li>

</ol>`;

<h2>5.1 Metabolisme</h2>
<p>Metabolisme = semua tindak balas kimia dalam sel. Terbahagi kepada:</p>
<ul>
<li><b>Anabolisme</b> – bina molekul kompleks (fotosintesis, sintesis protein)</li>
<li><b>Katabolisme</b> – pecahkan molekul kompleks (respirasi, pencernaan)</li>
</ul>

<h2>5.2 Enzim</h2>
<p>Enzim ialah pemangkin biologi (kebanyakannya protein) yang mempercepatkan tindak balas dengan menurunkan tenaga pengaktifan.</p>
<ul>
<li>Spesifik terhadap substrat (model kunci-dan-kunci / aruhan-muai)</li>
<li>Boleh diguna semula</li>
<li>Dipengaruhi oleh suhu, pH, kepekatan enzim & substrat</li>
</ul>
<p><b>Suhu optimum</b> manusia ≈ 37°C. Melebihi suhu tertentu enzim terdenaturasi.</p>
<p><b>pH optimum</b> berbeza: pepsin (pH 1.5–2.5), amilase air liur (pH 6.8–7.0), tripsin (pH 8–9).</p>

<h2>5.3 Aplikasi Enzim</h2>
<ul>
<li>Industri makanan: rennet (keju), protease (tenderiser daging)</li>
<li>Detergen: enzim pencuci noda</li>
<li>Perubatan: enzim dalam ujian diagnostik</li>
</ul>
<div class="tip"><b>Faktor yang menjejaskan enzim:</b> suhu tinggi → denaturasi; pH melampau → ubah bentuk tapak aktif; perencat kompetitif & bukan kompetitif.</div>
<h2>Uji Kefahaman</h2>
<ol>
<li>Apakah perbezaan anabolisme dan katabolisme?</li>
<li>Mengapa enzim dikatakan spesifik?</li>
<li>Nyatakan kesan suhu tinggi terhadap enzim.</li>
</ol>`;

<h2>7.1 Penghasilan Tenaga</h2>
<p>Respirasi sel menukarkan tenaga kimia dalam glukosa kepada ATP.</p>
<p><b>Persamaan keseluruhan respirasi aerob:</b></p>
<p>C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + tenaga (ATP) + haba</p>

<h2>7.2 Respirasi Aerob</h2>
<ol>
<li><b>Glikolisis</b> (sitoplasma) – glukosa → 2 asid piruvik + 2 ATP bersih + NADH</li>
<li><b>Kitar Krebs</b> (matriks mitokondria) – asid piruvik dioksidakan, hasilkan CO₂, NADH, FADH₂, 2 ATP</li>
<li><b>Rantaian pengangkutan elektron</b> (krista mitokondria) – NADH & FADH₂ hasilkan ~34 ATP, O₂ sebagai penerima elektron akhir → air</li>
</ol>
<p>Jumlah anggaran: 36–38 ATP setiap glukosa.</p>

<h2>7.3 Fermentasi (Respirasi Anaerob)</h2>
<ul>
<li><b>Fermentasi alkohol</b> (yis): glukosa → etanol + CO₂ + 2 ATP</li>
<li><b>Fermentasi asid laktik</b> (otot manusia): glukosa → asid laktik + 2 ATP</li>
</ul>
<div class="tip"><b>Perbandingan:</b> Respirasi aerob hasilkan lebih banyak ATP dan produk akhir tidak toksik; fermentasi berlaku tanpa oksigen tetapi kurang cekap.</div>
<h2>Uji Kefahaman</h2>
<ol>

<li>Di manakah kitar Krebs berlaku?</li>
<li>Berapa ATP dihasilkan dalam fermentasi?</li>
</ol>`;

 else if(selected[0]==="Biologi" && grade===5){

<h2>1.1 Organisasi Tisu Tumbuhan</h2>
<p>Tisu tumbuhan dibahagikan kepada:</p>
<ul>
<li><b>Tisu meristem</b> – sel yang aktif membahagi (meristem apeks, meristem lateral/kambium)</li>
<li><b>Tisu kekal</b> – tisu epidermis, tisu asas (parenkima, kolenkima, sklerenkima), tisu vaskular (xilem & floem)</li>
</ul>
<table>
<tr><th>Tisu</th><th>Ciri & Fungsi</th></tr>

<tr><td>Kolenkima</td><td>Dinding menebal di sudut, sokongan fleksibel</td></tr>
<tr><td>Sklerenkima</td><td>Dinding tebal berlignin, sokongan & kekuatan</td></tr>
<tr><td>Xilem</td><td>Angkut air & garam mineral, sokongan</td></tr>
<tr><td>Floem</td><td>Angkut bahan makanan (sukrosa)</td></tr>

<h2>1.2 Tisu Meristem dan Pertumbuhan</h2>

<h2>1.3 Lengkung Pertumbuhan</h2>

<h2>4.1 Tisu Vaskular</h2>
<p>Xilem (trakeid & salur xilem) – angkut air & mineral dari akar ke daun. Floem (tiub tapis & sel rakan) – angkut hasil fotosintesis.</p>

<h2>4.2 Pengangkutan Air dan Garam Mineral</h2>
<ul>
<li><b>Tekanan akar</b> – tolak air ke atas pada akar</li>
<li><b>Daya kapilari</b> – lekatan & kesatuan molekul air dalam xilem</li>
<li><b>Tarikan transpirasi</b> – daya utama; kehilangan air di daun menarik lajur air ke atas (teori kesatuan-lekatan-tarikan)</li>
</ul>

<h2>4.3 Translokasi</h2>
<p>Pengangkutan bahan organik (sukrosa) melalui floem dari sumber (daun) ke sinki (akar, buah, ubi) secara aktif (hipotesis aliran tekanan / model Münch).</p>

<h2>4.4 Fitoremediasi</h2>
<p>Penggunaan tumbuhan untuk membersihkan persekitaran tercemar (logam berat, bahan organik).</p>

<h2>11.1 Pewarisan Monohibrid</h2>
<p>Kajian pewarisan satu ciri. Undang-undang pengasingan Mendel: alel berpisah semasa pembentukan gamet.</p>
<p>Contoh: Kacukan tumbuhan kacang tinggi (TT) dengan kerdil (tt) → F1 semua tinggi (Tt) → F2 nisbah 3 tinggi : 1 kerdil.</p>

<h2>11.2 Pewarisan Dihibrid</h2>
<p>Dua ciri diwarisi serentak. Undang-undang penggabungan bebas → nisbah fenotip F2 = 9:3:3:1 (jika kedua-dua sifat dominan lengkap).</p>

<h2>11.3 Gen dan Alel</h2>
<ul>
<li><b>Gen</b> – unit pewarisan pada kromosom</li>
<li><b>Alel</b> – bentuk alternatif sesuatu gen</li>
<li><b>Genotip</b> – komposisi genetik (TT, Tt, tt)</li>
<li><b>Fenotip</b> – ciri yang dapat dilihat</li>
<li>Dominan vs resesif; homozigot vs heterozigot</li>
</ul>

<h2>11.4 Pewarisan Manusia</h2>
<p>Contoh: kumpulan darah ABO (alel berganda), buta warna & hemofilia (pautan seks X).</p>
